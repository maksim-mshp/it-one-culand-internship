basePath: /api/v1
definitions:
  APIError:
    properties:
      details:
        additionalProperties: {}
        type: object
      error:
        type: string
    type: object
  Internship:
    properties:
      description:
        type: string
      goals:
        items:
          type: string
        type: array
      id:
        type: integer
      label:
        type: string
      skills:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
info:
  contact: {}
  title: Internship API
paths:
  /internships:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Internship'
            type: array
      summary: Получить все стажировки
      tags:
      - internship
  /internships/{id}:
    get:
      parameters:
      - description: ID стажировки
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Internship'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIError'
      summary: Получить стажировку по ID
      tags:
      - internship
swagger: "2.0"
